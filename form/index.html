<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            font-family: Arial;
        }

        main {
            width: 50%;
            padding: 15px;
            margin: 50px auto;

        } 
        label {
            display: block;
            margin-bottom: 8px;
        }
    input[type="text"],
        select,


        textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }


        form {
            width: 100%;
            padding: 20px;
            background-color: #f2f2f2;

        }

        input[type="submit"]:hover {
            background-color: #008f5a;
            cursor: pointer;
        }
       

    

        textarea {
            resize: vertical;
        }

        input[type="submit"] {
            background-color: #04AA6D;
            color: #fff;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
        }
.h2{
    margin-bottom: 15px;
}
    </style>
</head>

<body>

    <main>
        <h2 class="h2">Contact Form</h2>
        <form action="">
            <label for="">First name*</label>
            <input type="text" placeholder="your name..."required>

            <label for="">Last name*</label>
            <input type="text" placeholder="your last name..."  required>

            <label for="">Country*</label>
            <select name="" id=""  required>
                <option value="0.1">Australia</option>
                <option value="0.2" selected>Canada</option>
                <option value="0.3">Usa</option>
            </select>



            <label for="">Subject*</label>
            <textarea name="subject" id="subject" cols="80" rows="10" placeholder="Write someting.."></textarea>

            <input type="submit" value="Submit">

        </form>
    </main>
</body>

</html>
